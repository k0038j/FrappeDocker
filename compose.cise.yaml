name: frappe_docker

x-customizable-image: &customizable_image
  image: ${CUSTOM_IMAGE:?Set CUSTOM_IMAGE in .env}:${CUSTOM_TAG:?Set CUSTOM_TAG in .env}
  pull_policy: ${PULL_POLICY:-never}
  restart: unless-stopped

x-backend-defaults: &backend_defaults
  <<: *customizable_image
  networks:
    - frappe_network
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs
  depends_on:
    configurator:
      condition: service_completed_successfully

services:
  backend:
    <<: *backend_defaults
    environment:
      SITE_NAME: ${SITE_NAME:-frontend}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -fsS -H "Host: $$SITE_NAME" http://127.0.0.1:8000/api/method/ping >/dev/null'
      start_period: 60s
      interval: 30s
      timeout: 10s
      retries: 5

  configurator:
    <<: *backend_defaults
    restart: on-failure
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
        bench set-config -g chromium_path /usr/bin/chromium-headless-shell;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

  create-site:
    <<: *backend_defaults
    restart: "no"
    entrypoint:
      - bash
      - -c
    command:
      - |
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        if [ -d "sites/$$SITE_NAME" ]; then
          echo "Site $$SITE_NAME already exists, skipping creation";
        else
          bench new-site "$$SITE_NAME" \
            --mariadb-user-host-login-scope='%' \
            --admin-password="$$ADMIN_PASSWORD" \
            --db-root-username=root \
            --db-root-password="$$DB_PASSWORD" \
            --install-app erpnext \
            --install-app hrms \
            --set-default "$$SITE_NAME";
        fi;
    environment:
      SITE_NAME: ${SITE_NAME:-frontend}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    depends_on:
      configurator:
        condition: service_completed_successfully

  db:
    image: mariadb:11.8.8
    restart: unless-stopped
    networks:
      - frappe_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 5
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - db-data:/var/lib/mysql

  frontend:
    <<: *customizable_image
    networks:
      - frappe_network
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:-frontend}
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: ${UPSTREAM_REAL_IP_ADDRESS:-127.0.0.1}
      UPSTREAM_REAL_IP_HEADER: ${UPSTREAM_REAL_IP_HEADER:-X-Forwarded-For}
      UPSTREAM_REAL_IP_RECURSIVE: ${UPSTREAM_REAL_IP_RECURSIVE:-off}
      PROXY_READ_TIMEOUT: ${PROXY_READ_TIMEOUT:-120}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-50m}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    ports:
      - "${HTTP_PUBLISH_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS http://127.0.0.1:8080/api/method/ping >/dev/null"
      start_period: 60s
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      backend:
        condition: service_healthy
      websocket:
        condition: service_healthy

  queue-long:
    <<: *backend_defaults
    command:
      - bench
      - worker
      - --queue
      - long,default,short
    environment:
      SITE_NAME: ${SITE_NAME:-frontend}
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    healthcheck:
      test:
        - CMD-SHELL
        - 'bench --site "$$SITE_NAME" doctor >/dev/null'
      start_period: 60s
      interval: 60s
      timeout: 20s
      retries: 3

  queue-short:
    <<: *backend_defaults
    command:
      - bench
      - worker
      - --queue
      - short,default
    environment:
      SITE_NAME: ${SITE_NAME:-frontend}
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    healthcheck:
      test:
        - CMD-SHELL
        - 'bench --site "$$SITE_NAME" doctor >/dev/null'
      start_period: 60s
      interval: 60s
      timeout: 20s
      retries: 3

  redis-cache:
    image: redis:6.2.23-alpine
    restart: unless-stopped
    networks:
      - frappe_network
    volumes:
      - redis-cache-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 5

  redis-queue:
    image: redis:6.2.23-alpine
    restart: unless-stopped
    networks:
      - frappe_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-queue-data:/data

  scheduler:
    <<: *backend_defaults
    command:
      - bench
      - schedule
    environment:
      SITE_NAME: ${SITE_NAME:-frontend}
    healthcheck:
      test:
        - CMD-SHELL
        - 'bench --site "$$SITE_NAME" scheduler status >/dev/null'
      start_period: 60s
      interval: 60s
      timeout: 20s
      retries: 3

  websocket:
    <<: *backend_defaults
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -fsS "http://127.0.0.1:9000/socket.io/?EIO=4&transport=polling" >/dev/null'
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  db-data:
  redis-cache-data:
  redis-queue-data:
  sites:
  logs:

networks:
  frappe_network:
    driver: bridge
